name: Offline evaluation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/eval.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evaluation
          path: |
            target/surefire-reports/
            target/evaluation/
