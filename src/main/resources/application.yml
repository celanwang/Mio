server:
  port: 8080

spring:
  application:
    name: mio
  mvc:
    async:
      request-timeout: 180s

app:
  mcp:
    mcd:
      # 是否启用麦当劳 MCP；在运行配置中设置 MCD_MCP_ENABLED=true。
      enabled: ${MCD_MCP_ENABLED:true}
      # 麦当劳 MCP 官方服务地址，使用流式 HTTP 协议。
      url: https://mcp.mcd.cn
      # 在运行配置中设置 MCD_MCP_TOKEN，填写麦当劳平台申请的令牌。
      token: ${MCD_MCP_TOKEN:}
    weibo:
      # 微博官方 MCP：OAuth 按需授权（无静态 token），授权凭证落盘本机 .weibo/auth.json（已 gitignore）。
      enabled: ${WEIBO_MCP_ENABLED:true}
      url: https://cli.weibo.com/mcp
      callback-uri: http://127.0.0.1:${server.port}/api/weibo/callback
      credentials-file: .weibo/auth.json

  tencent-ride:
    # 腾讯出行打车：本地 Python 桥接官方接口，Token 只经 stdin 传给子进程。
    enabled: ${TENCENT_RIDE_ENABLED:true}
    python: ${TENCENT_RIDE_PYTHON:python}
    # 在 .env 或运行配置中设置 TENCENT_RIDE_TOKEN（腾讯出行服务小程序获取，见 tencent-ride 技能 quick-start）。
    token: ${TENCENT_RIDE_TOKEN:}
    # 可选；留空时助手会主动询问本次出行城市和具体上下车地点。
    resident-city: ${TENCENT_RIDE_CITY:}
    data-directory: .tencent-ride
    timeout: 65s

  dashscope:
    # 留空时使用 AgentScope 默认地址；需要切换地域时填写该地域的 DashScope 地址。
    base-url: ${DASHSCOPE_BASE_URL:}
    # 默认不额外指定代理；按需设置环境变量，例如代理主机 127.0.0.1、端口 7890。
    proxy:
      host: ${DASHSCOPE_PROXY_HOST:}
      port: ${DASHSCOPE_PROXY_PORT:7890}
    api-key: ${DASHSCOPE_API_KEY:}
    # 主模型：可用 DASHSCOPE_MODEL 覆盖（账号需有对应模型权限，否则 DashScope 返回 404 model_not_found）。
    model-name: ${DASHSCOPE_MODEL:qwen3-max}
    # 轻量模型：配置 Jev 后由 Jev 按请求复杂度路由，简单请求走该模型。
    fast-model-name: ${DASHSCOPE_FAST_MODEL:qwen-flash}
    # 标准模型：Jev 路由的中间档，点餐/打车/微博等工具流程任务走该模型。
    plus-model-name: ${DASHSCOPE_PLUS_MODEL:qwen-plus}
    # 向量化模型：episode 情景回忆检索用（历史消息 embedding）。
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}

  jev:
    # 是否启用 Jev 决策审核：写操作先由 Jev 判断，通过则自动执行，不通过转人工确认。
    # 未启用或未配置 key 时，写操作一律转人工确认。
    enabled: ${JEV_ENABLED:true}
    # 在 .env 或运行配置中设置 TYPESAFE_API_KEY。
    api-key: ${TYPESAFE_API_KEY:}
    model: jev-latest
    # Noul 概率不低于该阈值时自动放行，否则转人工。
    auto-approve-threshold: ${JEV_AUTO_APPROVE_THRESHOLD:0.8}

  agent:
    name: 智能助手
    sys-prompt: "你是一个个人 AI 助手，请用中文回答用户的问题，并根据用户需求使用可用工具。"
    # Agent 技能目录（文件系统路径，默认项目根 ./skills）；修改技能无需重新构建。
    skills-dir: ${MIO_SKILLS_DIR:./skills}

  memory:
    # 记录型数据（事件日志/episode 原文/向量/实体三元组）存储后端：local（默认，本地 JSONL）
    # 或 pg（PostgreSQL + pgvector）；画像/信任/自动化始终为本地文件，不受该开关影响。
    store: ${MIO_MEMORY_STORE:local}
    pg:
      # pg 模式的连接信息（在 .env 或运行配置中设置 MIO_PG_JDBC_URL / MIO_PG_USERNAME / MIO_PG_PASSWORD）。
      url: ${MIO_PG_JDBC_URL:}
      username: ${MIO_PG_USERNAME:}
      password: ${MIO_PG_PASSWORD:}
    redis:
      # 短期记忆（会话上下文/去重/缓存）连接信息；host 留空时回退进程内存，fail-open。
      # 预留配置项，代码侧接入后生效。
      host: ${MIO_REDIS_HOST:}
      port: ${MIO_REDIS_PORT:6379}
      password: ${MIO_REDIS_PASSWORD:}
    # 用户画像与记忆数据目录（画像/信任/事件日志），默认项目根目录下 .mio（已 gitignore）。
    dir: ${MIO_DATA_DIR:./.mio}
    distiller:
      # 是否用轻量模型从对话中提炼显式用户偏好。
      enabled: ${MIO_DISTILLER_ENABLED:true}
    habit-detector:
      # 是否从事件日志中统计习惯并生成自动化提议（提议仍需用户在面板批准才生效）。
      enabled: ${MIO_HABIT_DETECTOR_ENABLED:true}
    inject:
      # 画像注入是否按当前消息做相关性过滤；false 时回退为全量注入（用于对比/回滚）。
      filter-enabled: ${MIO_INJECT_FILTER_ENABLED:true}
      # 规则未命中的领域页是否交轻量模型二次判定相关性（超时/失败倒向不注入）。
      llm-filter-enabled: ${MIO_INJECT_LLM_FILTER_ENABLED:true}
      # 是否启用画像页向量召回（页面变更异步建内存索引，embedding 不可用时静默降级）。
      vector-enabled: ${MIO_INJECT_VECTOR_ENABLED:true}
      # 向量召回余弦相似度阈值（已用真实 text-embedding-v4 数据校准：相关对 0.40–0.58，无关对 ≤0.30）。
      vector-min-score: ${MIO_INJECT_VECTOR_MIN_SCORE:0.35}
      # 单次注入的画像条目数上限，超出时按置信度 × 新近度截断。
      max-entries: ${MIO_INJECT_MAX_ENTRIES:30}
    rag:
      # 是否启用 episode 情景回忆检索（embedding 不可用时自动静默降级，不影响对话）。
      enabled: ${MIO_RAG_ENABLED:true}
      # 单次召回条数上限 / 余弦相似度阈值（宁缺毋滥，低于阈值不注入）。
      top-k: ${MIO_RAG_TOP_K:3}
      min-score: ${MIO_RAG_MIN_SCORE:0.6}
