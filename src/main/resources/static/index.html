:root {

  --text:#e8eaf0; --secondary:#969ab0; --muted:#757b95;

  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --gradient-brand:linear-gradient(135deg,#8b76ed,#6366f1);
  --gradient-text:linear-gradient(120deg,var(--cyan),var(--purple));
}
[data-theme=light] {
  color-scheme:light;
  --bg:#f0f2f8; --panel:rgba(255,255,255,.93); --input:#f4f5fa; --hover:#eceef7;
  --text:#1a1a2e; --secondary:#5a5d78; --muted:#6d728c;
  --border:rgba(15,15,40,.09); --border-strong:rgba(15,15,40,.18); --grid:rgba(60,60,120,.03);
  --cyan:#2563eb; --purple:#7c3aed; --pink:#db2777; --green:#059669; --amber:#b77909;

  <script>
'use strict';

// 任务回答、恢复和批准均通过 POST /chat；任务状态从本机 API 回读。
const $ = id => document.getElementById(id);
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};
function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','icon'); svg.setAttribute('aria-hidden','true');
  const use = document.createElementNS('http://www.w3.org/2000/svg','use');
  use.setAttribute('href','#i-' + name); svg.append(use); return svg;
}
function readStore(kind,key) { try { return window[kind].getItem(key); } catch (_) { return null; } }
function writeStore(kind,key,value) { try { window[kind].setItem(key,value); } catch (_) { /* 存储不可用时仍可正常聊天。 */ } }
function validateBase(value) {
  let url;
  try { url = new URL(value.trim()); } catch (_) { throw new Error('请输入有效的服务地址，例如 http://localhost:8080。'); }
  if (!['http:','https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) throw new Error('服务地址只支持 http 或 https，请勿包含账号、查询参数或锚点。');
  return url.href.replace(/\/$/,'');
}
const defaultBase = location.protocol === 'file:' || location.port === '63342' ? 'http://localhost:8080' : location.origin;
let apiBase = defaultBase;
try { apiBase = validateBase(readStore('localStorage','mio-api-base') || defaultBase); } catch (_) {}
$('api-base').value = apiBase;
let busy = false, goalControlBusy = false, chatAbortController = null;
let chat;
let toastTimer;
let theme = readStore('localStorage','mio-theme') === 'light' ? 'light' : 'dark';
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const label = theme === 'dark' ? '切换浅色主题' : '切换深色主题';
  $('theme').setAttribute('aria-label',label); $('theme').title = label;
  $('theme-icon').setAttribute('href',theme === 'dark' ? '#i-sun' : '#i-moon');
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0a0a0f' : '#f0f2f8';
  document.dispatchEvent(new Event('mio-theme-change'));
}
applyTheme();
$('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); writeStore('localStorage','mio-theme',theme); };
function toast(text) { clearTimeout(toastTimer); $('toast').textContent = text; $('toast').hidden = false; toastTimer = setTimeout(() => $('toast').hidden = true,2500); }
function showError(text) { $('error-text').textContent = text; $('error').hidden = false; }
$('dismiss-error').onclick = () => $('error').hidden = true;
function storageKey() { return 'mio-chat-v2:' + apiBase; }
function save() { writeStore('sessionStorage',storageKey(),JSON.stringify(chat)); }
function createChat() { return { id: globalThis.crypto?.randomUUID?.() || 'chat-' + Date.now() + '-' + Math.random().toString(36).slice(2), sessionId: null, messages: [], pendingConfirmations: [], tasks:[], goal:null, budget:null, multiAgent:false, replyTarget:null, weiboAction:null, weiboAuthorizationPending:false }; }
function validReplyTarget(target) {
  return target && typeof target.taskId === 'string' && typeof target.questionId === 'string' && typeof target.agent === 'string' ? target : null;
}
function currentReplyQuestion() {
  return chat.replyTarget && chat.tasks.find(t => t.id === chat.replyTarget.taskId && t.status === 'NEEDS_INPUT' && t.questionId === chat.replyTarget.questionId);
}
function selectTaskReply(task) {
  if (busy) return;
  chat.replyTarget = {taskId:task.id,questionId:task.questionId,agent:task.agent}; save(); updateComposer(); $('message').focus();
}
$('clear-reply').onclick = () => { if (busy) return; chat.replyTarget = null; save(); updateComposer(); $('message').focus(); };
function validCalls(calls) {
  if (!Array.isArray(calls) || calls.some(c => !c || typeof c.toolCallId !== 'string' || !c.toolCallId || typeof c.name !== 'string') || new Set(calls.map(c => c.toolCallId)).size !== calls.length) throw new Error('服务返回的操作确认格式异常，请开启新对话后重试。');
  return calls;
}
function validTasks(tasks) {
  if (!Array.isArray(tasks) || tasks.some(t => !t || typeof t.id !== 'string' || typeof t.agent !== 'string' || typeof t.objective !== 'string' || typeof t.status !== 'string' || typeof t.reply !== 'string')) throw new Error('服务返回的任务状态格式异常。');
  return tasks;
}
function validGoal(goal) {
  if (goal == null) return null;
  if (!['ACTIVE','PAUSED','CLOSED'].includes(goal.state) || !Number.isSafeInteger(goal.controlRevision) || goal.controlRevision < 0) throw new Error('目标控制状态异常，请重新读取。');
  return goal;
}
function validBudget(budget) {
  if (budget == null) return null;
  if (!budget.limits || ['models','tools','tasks','knownTokens','pendingUsage','unknownUsage'].some(k => !Number.isFinite(budget[k]) || budget[k] < 0)
      || ['models','tools','tasks','tokens'].some(k => !Number.isFinite(budget.limits[k]) || budget.limits[k] < 1)) throw new Error('目标预算状态异常。');
  return budget;
}
function goalStopped() { return chat.goal && chat.goal.state !== 'ACTIVE'; }
function renderGoal() {
  const container=$('goal-overview'), expanded=container.querySelector('details')?.open===true; container.replaceChildren(); container.hidden=!chat.multiAgent || !chat.goal; if(container.hidden)return;
  const goal=chat.goal, labels={ACTIVE:'进行中',PAUSED:'已暂停',CLOSED:'已关闭'}, row=el('div','goal-row');
  row.append(el('strong','','目标'+labels[goal.state]+' · 执行 '+goal.running+' · 排队 '+goal.queued+' · 失败 '+goal.failed+' · 失效 '+goal.invalidated+' · 补问 '+goal.questions+' · 待确认 '+goal.approvals+' · 待核查 '+goal.unresolved));
  const actions=el('div','goal-actions');
  for(const [state,label] of (goal.state==='ACTIVE'?[['PAUSED','暂停目标'],['CLOSED','关闭目标']]:goal.state==='PAUSED'?[['ACTIVE','恢复目标'],['CLOSED','关闭目标']]:[])) {
    const button=el('button','quiet',label);button.type='button';button.disabled=goalControlBusy;button.onclick=()=>changeGoal(state);actions.append(button);
  }
  row.append(actions);container.append(row);
  const details=el('details','goal-details');details.open=expanded;
  if(chat.budget){const b=chat.budget;details.append(el('summary','goal-note','累计预占：模型 '+b.models+'/'+b.limits.models+' · 工具 '+b.tools+'/'+b.limits.tools+' · 任务 '+b.tasks+'/'+b.limits.tasks+' · 已报告 token '+b.knownTokens+'/'+b.limits.tokens+(b.usageComplete?' · 统计说明':' · 用量有缺口（展开）')));
    details.append(el('div','goal-note',b.usageComplete?'当前账本用量完整；token 阈值不等于费用硬上限。':'用量存在缺口：待结算 '+b.pendingUsage+'，未知 '+b.unknownUsage+(b.historyUnknown?'，历史不可追溯':'')+'；不是零消耗。'));
  }else details.append(el('summary','goal-note','目标边界与预算说明'));
  details.append(el('div','goal-note',goal.state==='CLOSED'?'已停止新执行，历史、预算与未核查操作保留。开启新对话可规划新目标。':goal.state==='PAUSED'?'待运行任务保留；恢复后需显式继续。旧批准与中断任务不会自动恢复。':'受控前台预览 · 生产资格尚未评定'));
  container.append(details);
}
function applyOperational(data){
  const goal=validGoal(data.goal), budget=validBudget(data.budget);
  if(goal && chat.goal && goal.id===chat.goal.id && goal.controlRevision<chat.goal.controlRevision)return false;
  chat.goal=goal;
  if(!budget || !chat.budget || budget.goalId!==chat.budget.goalId || !Number.isSafeInteger(budget.revision) || !Number.isSafeInteger(chat.budget.revision) || budget.revision>=chat.budget.revision)chat.budget=budget;
  return true;
}
async function changeGoal(state) {
  if(goalControlBusy || !chat.goal)return;const current=chat, base=apiBase;goalControlBusy=true;renderGoal();
  try {
    const response=await fetch(base+'/api/tasks/goal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:chat.sessionId,expectedControlRevision:chat.goal.controlRevision,state})});
    const data=await response.json();if(!response.ok)throw new Error(data.message || '目标状态未更新，请核对。');if(chat!==current || apiBase!==base)return;
    $('error').hidden=true;
    if(!applyOperational(data)){await refreshTasks(true);return;}chat.tasks=validTasks(data.tasks||[]);chat.pendingConfirmations=validCalls(data.pendingConfirmations||[]);chat.weiboAction=validWeiboAction(data.weiboAction);save();render();
    if(goalStopped())chatAbortController?.abort();
  }catch(error){showError(error.message);try{await refreshTasks(true);if(goalStopped())chatAbortController?.abort();}catch(_){} }
  finally{goalControlBusy=false;renderGoal();}
}
async function reconcileTask(taskId,operationId){
  if(busy)return;setBusy(true);
  try{const response=await fetch(apiBase+'/api/tasks/'+encodeURIComponent(taskId)+'/operations/'+encodeURIComponent(operationId)+'/reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:chat.sessionId})});
    const data=await response.json();if(!response.ok)throw new Error(data.message||'核查未完成，请保留未知状态。');if(!applyOperational(data)){await refreshTasks(true);return;}chat.tasks=validTasks(data.tasks||[]);save();render();
  }catch(error){showError(error.message);try{await refreshTasks(true);}catch(_){} }finally{setBusy(false);}
}
function renderTasks() {
  const container = $('task-progress'); container.replaceChildren(); const tasks = chat.tasks || []; container.hidden = !tasks.length;
  const labels = { QUEUED:'已排队，等待领取',WAITING_DEPENDENCY:'等待前置任务',RUNNING:'处理中',NEEDS_INPUT:'等待补充信息',INPUT_READY:'回答已收到，等待继续',AWAITING_APPROVAL:'等待你确认',COMPLETED:'本轮已结束',FAILED:'未完成',UNKNOWN:'提交结果待核查',CANCELLED:'已停止',STALE:'信息已变更，需重新准备' };
  for (const task of tasks) {
