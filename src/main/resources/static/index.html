<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0f">
  <title>Mio · 你的个人智能助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2316161f'/%3E%3Ccircle cx='20' cy='20' r='13' fill='none' stroke='%2364dcff'/%3E%3Ccircle cx='20' cy='20' r='6' fill='none' stroke='%23a78bfa'/%3E%3Ccircle cx='20' cy='20' r='2' fill='%2364dcff'/%3E%3C/svg%3E">
  <style>
:root {
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  color-scheme: dark;
  --bg:#0a0a0f; --panel:rgba(22,22,31,.91); --input:#1a1a26; --hover:#20202e;
  --text:#e8eaf0; --secondary:#969ab0; --muted:#757b95;
  --border:rgba(100,220,255,.12); --grid:rgba(100,220,255,.035);
  --cyan:#64dcff; --purple:#a78bfa; --pink:#f472b6; --green:#34d399; --amber:#fbbf24;
  --nav:rgba(10,10,15,.88); --soft:rgba(167,139,250,.08); --glow:rgba(100,220,255,.1);
  --shadow:0 20px 65px rgba(0,0,0,.25); --code:#101018; --user:rgba(167,139,250,.1);
}
[data-theme=light] {
  color-scheme:light;
  --bg:#f0f2f8; --panel:rgba(255,255,255,.93); --input:#f4f5fa; --hover:#eceef7;
  --text:#1a1a2e; --secondary:#5a5d78; --muted:#6d728c;
  --border:rgba(60,60,120,.12); --grid:rgba(60,60,120,.045);
  --cyan:#2563eb; --purple:#7c3aed; --pink:#db2777; --green:#059669; --amber:#b77909;
  --nav:rgba(240,242,248,.9); --soft:rgba(124,58,237,.045); --glow:rgba(37,99,235,.06);
  --shadow:0 16px 55px rgba(52,55,100,.07); --code:#eef0f7; --user:rgba(124,58,237,.065);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);transition:background .35s,color .35s}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:default;opacity:.42}
button,a,summary{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
[hidden]{display:none!important}::selection{background:rgba(167,139,250,.3)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--secondary) 24%,transparent);border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.symbol-library{position:absolute;width:0;height:0;overflow:hidden}
#bg-canvas,.grid-overlay,.ambient{position:fixed;inset:0;pointer-events:none}
#bg-canvas{width:100%;height:100%;opacity:.65}
.grid-overlay{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:60px 60px}
.ambient{background:radial-gradient(ellipse at 18% 20%,rgba(100,220,255,.045),transparent 42%),radial-gradient(ellipse at 82% 68%,rgba(167,139,250,.055),transparent 40%)}
.topbar{position:relative;z-index:5;height:72px;padding:0 38px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--border);background:var(--nav);backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}.brand-mark{width:36px;height:36px}
.brand-name{font-size:20px;font-weight:700;letter-spacing:1.2px;background:linear-gradient(120deg,var(--cyan),var(--purple));background-clip:text;color:transparent}
.brand-sub{display:block;margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:2px}
.top-actions{display:flex;align-items:center;gap:14px}.nav-note{color:var(--muted);font-size:13px;letter-spacing:1px;padding-right:16px;border-right:1px solid var(--border)}
.quiet{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;border:1px solid var(--border);background:transparent;border-radius:8px;padding:8px 12px;color:var(--secondary);font-size:14px;transition:background .2s,border-color .2s,color .2s}
.quiet:hover:not(:disabled){background:var(--hover);border-color:color-mix(in srgb,var(--purple) 50%,transparent);color:var(--text)}
.icon-button{display:grid;place-items:center;width:34px;height:34px;padding:0}
.settings{position:relative}.settings summary{list-style:none;cursor:pointer}.settings summary::-webkit-details-marker{display:none}
.settings-panel{position:absolute;top:46px;right:0;width:310px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(24px)}
.settings-panel label{font-size:15px;font-weight:600}.settings-panel p{font-size:13px;color:var(--secondary);line-height:1.8;margin:8px 0 12px}
.settings-panel input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--input);color:var(--text);font:14px Consolas,monospace}
.settings-panel button{margin-top:12px;width:100%}.settings-error{color:var(--pink)!important}
.workspace{position:relative;z-index:1;display:flex;flex-direction:column;max-width:1600px;height:calc(100dvh - 72px);min-height:560px;margin:0 auto;padding:24px 24px 18px}
.chat-panel{position:relative;display:flex;flex:1;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(16px);animation:rise .65s .1s both}
.chat-panel::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);opacity:.65}
.panel-header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border)}
.panel-heading{display:flex;align-items:center;gap:10px}.panel-heading>.icon{color:var(--purple);width:22px;height:22px}.panel-heading strong{font-weight:500;font-size:16px}
.panel-status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-left:12px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--secondary)}
[data-status=busy] .status-dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:breathe 1.5s infinite}
[data-status=waiting] .status-dot{background:var(--amber)}[data-status=ready] .status-dot{background:var(--green)}
.chat-tools{display:flex;gap:8px}.chat-tools .quiet{font-size:13px;padding:8px 13px}.chat-tools .icon{width:16px;height:16px}
.conversation{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.welcome-orbit{position:relative;display:grid;place-items:center;width:74px;height:74px;margin-bottom:15px}
.welcome-orbit::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--glow);filter:blur(20px)}.welcome-orbit svg{width:66px;height:66px;position:relative}
.welcome h2{font-size:26px;font-weight:600;letter-spacing:.5px;margin:0 0 12px}.welcome>p{color:var(--secondary);font-size:15px;line-height:1.9;margin:0}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,640px);margin-top:28px;text-align:left}
.suggestion{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:11px;background:var(--input);text-align:left;transition:transform .2s,border-color .2s,background .2s}
.suggestion:hover{border-color:color-mix(in srgb,var(--purple) 50%,transparent);background:var(--hover);transform:translateY(-2px)}
.suggestion>.icon{color:var(--purple);width:19px;height:19px}.suggestion:nth-child(2)>.icon{color:var(--cyan)}.suggestion:nth-child(3)>.icon{color:var(--green)}.suggestion:nth-child(4)>.icon{color:var(--pink)}
.suggestion span{min-width:0;flex:1}.suggestion strong{display:block;font-size:15px;font-weight:500;color:var(--text)}.suggestion small{display:block;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.6}.suggestion .arrow{width:15px;height:15px;color:var(--muted)}
#messages{padding:12px 0}.message{display:flex;align-items:flex-start;gap:14px;width:100%;margin:0;padding:20px 32px;animation:rise .25s both}
.avatar{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:12px;color:var(--cyan);background:linear-gradient(140deg,rgba(100,220,255,.12),rgba(167,139,250,.12));border:1px solid var(--border)}.avatar .icon{width:22px;height:22px}
.message-main{min-width:0;flex:0 1 1080px;max-width:calc(100% - 54px)}.message-label{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font-size:13px;color:var(--secondary)}.message-time{color:var(--muted);font:11px Consolas,monospace}
.message-body{font-size:17px;line-height:1.85;overflow-wrap:anywhere}.message-body>:first-child{margin-top:0}.message-body>:last-child{margin-bottom:0}
.message.assistant .message-body{padding:14px 18px;background:color-mix(in srgb,var(--input) 60%,transparent);border:1px solid var(--border);border-radius:4px 16px 16px 16px}
.message-body p{margin:0 0 14px;white-space:pre-wrap}.message-body h3,.message-body h4,.message-body h5{margin:20px 0 10px;font-size:20px}.message-body h4,.message-body h5{font-size:18px}
.message-body ul,.message-body ol{margin:8px 0 14px;padding-left:22px}.message-body li{padding:2px 0}
.message-body blockquote{border-left:2px solid var(--purple);margin:12px 0;padding:6px 14px;color:var(--secondary);background:var(--soft);white-space:pre-wrap}
.message-body a{color:var(--cyan);text-underline-offset:3px}.message-body code{padding:2px 5px;border-radius:4px;background:var(--soft);color:var(--purple);font:14px/1.7 Consolas,monospace}
.code-block{margin:12px 0;background:var(--code);border:1px solid var(--border);border-radius:10px;overflow:hidden}.code-caption{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--border);color:var(--muted);font:12px Consolas,monospace}
.code-caption button{border:0;background:transparent;color:var(--secondary);font-size:12px}.code-block pre{margin:0;overflow:auto;padding:14px}.code-block code{color:var(--text);background:transparent;padding:0;white-space:pre}
.table-wrap{max-width:100%;overflow:auto;margin:14px 0}.message-body table{border-collapse:collapse;min-width:100%;font-size:15px}.message-body td,.message-body th{text-align:left;border:1px solid var(--border);padding:9px 12px}.message-body th{background:var(--soft)}
.message.user{flex-direction:row-reverse}.message.user .avatar{color:#fff;background:linear-gradient(135deg,#8b76ed,#6366f1);border-color:rgba(139,118,237,.3)}.message.user .message-main{text-align:right}.message.user .message-label{justify-content:flex-end;margin-right:2px}
.message.user .message-body{display:inline-block;max-width:100%;background:var(--user);border:1px solid color-mix(in srgb,var(--purple) 22%,transparent);border-radius:16px 4px 16px 16px;padding:14px 18px;text-align:left;white-space:pre-wrap}
.message-actions{display:flex;align-items:center;gap:6px;margin-top:10px}.message-actions button{display:flex;align-items:center;gap:6px;min-height:28px;background:transparent;border:0;color:var(--muted);padding:2px 0;font-size:12px}.message-actions button:hover{color:var(--cyan)}.message-actions .icon{width:14px;height:14px}
.thinking{display:flex;align-items:center;gap:7px;color:var(--secondary);font-size:14px;padding:3px 0}.thinking i{height:5px;width:5px;background:var(--purple);border-radius:50%;animation:breathe 1.4s infinite}.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}.thinking span{margin-left:5px}
#confirmations{margin:0 0 12px}
.confirmation-header{display:flex;align-items:flex-start;gap:10px;padding:0 0 12px}.confirmation-header>.icon{width:21px;height:21px;color:var(--amber);margin-top:2px}.confirmation-header h3{margin:0 0 5px;font-size:16px;font-weight:600}.confirmation-header p{margin:0;color:var(--secondary);font-size:13px;line-height:1.7}
.confirmation-list{max-height:180px;overflow:auto;overscroll-behavior:contain;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.confirmation-item{padding:12px 0}.confirmation-item+.confirmation-item{border-top:1px solid var(--border)}.operation-title{font-size:15px;font-weight:500}.operation-copy{color:var(--secondary);font-size:13px;margin:5px 0 0;line-height:1.7;overflow-wrap:anywhere}
.operation-details{margin-top:8px}.operation-details summary{color:var(--muted);cursor:pointer;font-size:12px;width:fit-content}.operation-details dl{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr);gap:7px 15px;font-size:13px;margin:10px 0 0;padding:12px;background:var(--code);border-radius:8px}.operation-details dt{color:var(--secondary);overflow-wrap:anywhere}.operation-details dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.composer-area{padding:16px 24px 12px;border-top:1px solid var(--border);flex-shrink:0;background:color-mix(in srgb,var(--panel) 95%,var(--bg))}.composer{background:var(--input);border:1px solid var(--border);padding:14px 15px 10px;border-radius:13px;transition:border-color .25s,box-shadow .25s}.composer:focus-within{border-color:color-mix(in srgb,var(--purple) 70%,transparent);box-shadow:0 0 0 3px var(--soft)}
textarea{display:block;width:100%;padding:0;background:transparent;border:0;outline:0;color:var(--text);font-size:17px;line-height:1.8;resize:none;min-height:44px;max-height:180px}textarea::placeholder{color:var(--muted)}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:8px}.composer-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;min-width:0;flex:1 1 100px}.composer-label .icon{width:15px;height:15px;color:var(--purple)}
.send-button{display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:linear-gradient(125deg,#8b76ed,#6366f1);color:#fff;border-radius:9px;padding:10px 18px;font-size:15px;transition:box-shadow .2s,transform .2s}.send-button:hover:not(:disabled){box-shadow:0 3px 18px rgba(167,139,250,.25);transform:translateY(-1px)}.send-button .icon{width:18px;height:18px}
.composer-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
.composer-actions .deny-button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;border:1px solid var(--border);border-radius:9px;padding:9px 18px;font-size:15px;color:var(--secondary);background:transparent}
.composer-actions .deny-button:hover:not(:disabled){color:var(--pink);border-color:var(--pink);background:color-mix(in srgb,var(--pink) 8%,transparent)}
.composer[data-mode=confirmation]{border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.composer[data-mode=confirmation] .send-button{background:color-mix(in srgb,var(--green) 12%,var(--input));border:1px solid color-mix(in srgb,var(--green) 45%,transparent);color:var(--green);padding:9px 18px}
.composer[data-mode=confirmation] .send-button:hover:not(:disabled){border-color:var(--green);box-shadow:0 3px 18px color-mix(in srgb,var(--green) 14%,transparent)}
.composer-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;font-size:11px;line-height:1.6;color:var(--muted);margin-top:10px}.composer-foot>span:last-child{text-align:right}
.error{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--pink) 28%,transparent);border-radius:9px;color:var(--pink);background:color-mix(in srgb,var(--pink) 6%,transparent);font-size:14px;line-height:1.8;margin-bottom:12px}.error .icon{width:18px;height:18px;margin-top:2px}.error span{flex:1}.error button{background:transparent;border:0;color:inherit;padding:0}
.page-footer{display:flex;justify-content:space-between;gap:12px;padding:14px 3px 0;font-size:11px;color:var(--muted);letter-spacing:.6px}.page-footer span:last-child{display:flex;align-items:center;gap:5px}.page-footer .icon{width:13px;height:13px}
.toast{position:fixed;z-index:20;bottom:25px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:12px;color:var(--text);box-shadow:var(--shadow);backdrop-filter:blur(20px)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes breathe{50%{opacity:.35}}
@media(min-height:900px){.welcome{padding:45px 24px}.welcome-orbit{margin-bottom:22px}.suggestions{margin-top:32px}}
@media(max-width:700px){
  .topbar{height:62px;padding:0 18px}.nav-note{display:none}.brand-name{font-size:17px}.brand-mark{width:30px;height:30px}.brand-sub{font-size:10px;letter-spacing:1px}.top-actions{gap:8px}
  .workspace{height:calc(100dvh - 62px);min-height:480px;padding:14px 14px 12px}
  .chat-panel{border-radius:14px}.panel-header{padding:13px 14px}.panel-status{margin-left:0}.panel-heading{gap:7px}.panel-heading strong{font-size:14px}.chat-tools{gap:6px}.chat-tools .quiet{padding:6px 9px;font-size:12px}
  .welcome{padding:27px 18px}.welcome h2{font-size:22px}.welcome>p{font-size:13px}.suggestions{gap:8px;margin-top:22px}.suggestion{padding:12px;gap:9px}.suggestion small{font-size:11px}.suggestion strong{font-size:13px}.suggestion .arrow{display:none}
  .message{padding:18px 12px;gap:10px}.avatar{width:36px;height:36px;flex-basis:36px;border-radius:11px}.avatar .icon{width:21px;height:21px}.message-main{flex:1;max-width:calc(100% - 46px)}.message-label{font-size:12px}.message-body{font-size:16px}.message.assistant .message-body,.message.user .message-body{padding:12px 14px}.message-body h3{font-size:19px}.message-body h4,.message-body h5{font-size:17px}
  .confirmation-list{max-height:145px}.confirmation-header h3{font-size:15px}.composer-actions .deny-button,.composer[data-mode=confirmation] .send-button{padding:9px 14px;font-size:14px}
  .composer-area{padding:12px 14px}.composer{padding:12px}textarea{font-size:16px}.composer-foot{font-size:10px;gap:8px}.composer-label{font-size:11px}.page-footer{font-size:10px;letter-spacing:0}.settings-panel{right:-44px;width:min(310px,calc(100vw - 32px))}
}
@media(max-width:420px){.panel-status{display:none}.suggestion{gap:8px}.suggestion>.icon{width:16px;height:16px}.composer-foot>span:first-child{max-width:145px}.page-footer{letter-spacing:0}.brand-sub{letter-spacing:1px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>

  $('chat-form').dataset.mode = waiting ? 'confirmation' : 'message';
  $('message-input').hidden = waiting;
  $('send').disabled = busy || (!waiting && !$('message').value.trim()); $('message').disabled = busy || waiting;
  $('deny').hidden = !waiting; $('deny').disabled = busy;
  $('send-label').textContent = busy ? '处理中' : waiting ? '允许' : '发送';
  $('send-icon').setAttribute('href',waiting ? '#i-check' : '#i-send');
  $('send').setAttribute('aria-label',waiting ? '允许本次' + chat.pendingConfirmations.length + '项操作' : '发送消息');
  $('deny').setAttribute('aria-label','拒绝本次' + chat.pendingConfirmations.length + '项操作');
  $('new-chat').disabled = busy; $('export').disabled = busy || !chat.messages.length; $('api-base').disabled = busy; $('save-api').disabled = busy;
  $('hint').textContent = busy ? '正在处理，请稍候…' : waiting ? '授权仅对本次操作有效' : 'Enter 发送 · Shift + Enter 换行';
  $('composer-label').textContent = waiting ? '等待确认 · ' + chat.pendingConfirmations.length + ' 项' : busy ? 'Mio · 正在思考' : 'Mio · 随时为你';
  $('panel-status').dataset.status = busy ? 'busy' : waiting ? 'waiting' : chat.messages.length ? 'ready' : 'idle';
  $('status-text').textContent = busy ? '正在思考' : waiting ? '等待确认' : chat.messages.length ? '可以继续对话' : '等待消息';
  $('conversation').setAttribute('aria-busy',String(busy));
  $('chat-form').setAttribute('aria-busy',String(busy));
}
function submitConfirmations(approved) {
  if (busy || !chat.pendingConfirmations.length) return;
  sendMessage('',chat.pendingConfirmations.map(call => ({ toolCallId:call.toolCallId,approved })));
}
function setBusy(value) { busy = value; updateComposer(); renderConfirmations(); }
function resizeInput() { $('message').style.height = 'auto'; $('message').style.height = Math.min($('message').scrollHeight,180) + 'px'; }
$('message').addEventListener('input',() => { resizeInput(); updateComposer(); });
$('message').addEventListener('keydown',event => { if (!busy && !chat.pendingConfirmations.length && event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) { event.preventDefault(); $('chat-form').requestSubmit(); } });
$('chat-form').onsubmit = event => {
  event.preventDefault(); if (busy) return;
  if (chat.pendingConfirmations.length) { submitConfirmations(true); return; }
  const text = $('message').value.trim(); if (text) sendMessage(text);
};
$('deny').onclick = () => submitConfirmations(false);
document.querySelectorAll('[data-prompt]').forEach(button => { button.onclick = () => { if (busy || chat.pendingConfirmations.length) return; $('message').value = button.dataset.prompt; resizeInput(); updateComposer(); $('message').focus(); }; });
async function sendMessage(text,confirmations = []) {
  if (busy) return;
  const isConfirmation = confirmations.length > 0; if (!isConfirmation && (!text || chat.pendingConfirmations.length)) return;
  $('error').hidden = true; const userMessage = { role:'user',content:text }; if (!isConfirmation) chat.messages.push(userMessage);
  $('message').value = ''; resizeInput(); render(); setBusy(true);
  const pending = addMessage({ role:'assistant',content:isConfirmation ? '正在根据你的决定继续处理…' : '正在思考并处理你的请求…' },true); scrollToLatest();
  const start = performance.now(), controller = new AbortController(), timeout = setTimeout(() => controller.abort(),185000);
  try {
    const response = await fetch(apiBase + '/chat', { method:'POST',headers:{ 'Content-Type':'application/json','Accept':'application/json' },body:JSON.stringify({ message:text,sessionId:chat.sessionId || chat.id,confirmations }),signal:controller.signal });
    if (!response.ok) {
      let data = {}; try { data = await response.json(); } catch (_) {}
      throw new Error(typeof data.message === 'string' ? data.message : response.status === 409 ? '当前会话状态已变更，请稍后重试；如果服务已重启，请开启新对话。' : `请求失败（${response.status}），请稍后重试。`);
    }
    const data = await response.json();
    if (typeof data.reply !== 'string' || typeof data.sessionId !== 'string' || !data.sessionId) throw new Error('没有收到有效的回复和会话编号，请稍后重试。');
    const calls = validCalls(data.pendingConfirmations ?? []); chat.sessionId = data.sessionId;
    if (isConfirmation) {
      const allAllowed = confirmations.every(c => c.approved), allDenied = confirmations.every(c => !c.approved);
      const decisionText = allAllowed ? '允许本次操作' : allDenied ? '拒绝本次操作' : confirmations.map(c => `${c.approved ? '允许' : '拒绝'}：${operationInfo(chat.pendingConfirmations.find(call => call.toolCallId === c.toolCallId))[0]}`).join('\n');
      chat.messages.push({ role:'user',content:decisionText });
    }
    chat.pendingConfirmations = calls;
    chat.messages.push({ role:'assistant',content:data.reply || (calls.length ? '需要你确认以下操作后，才能继续。' : '本次处理已结束。'),elapsed:((performance.now()-start)/1000).toFixed(1) });
  } catch (error) {
    // 失败时保留原输入或输入区的待确认操作，允许修改、重试，不自动批准任何操作。
    if (!isConfirmation) { const index = chat.messages.indexOf(userMessage); if (index >= 0) chat.messages.splice(index,1); $('message').value = text; resizeInput(); }
    showError(error.name === 'AbortError' ? '等待回复超时。服务端可能仍在处理，请稍候再试。' : error instanceof TypeError ? '暂时无法连接助手。请确认项目已启动、服务地址正确。建议通过 http://localhost:8080 打开本页面。' : error.message);
  } finally {
    clearTimeout(timeout); pending.remove(); setBusy(false); save(); render(); if (!chat.pendingConfirmations.length) $('message').focus();
  }
}
$('export').onclick = () => {
  if (busy || !chat.messages.length) return;
  const text = '# Mio 对话记录\n\n' + chat.messages.map(m => `## ${m.role === 'user' ? '你' : 'Mio'}\n\n${m.content}`).join('\n\n---\n\n') + '\n';
  const url = URL.createObjectURL(new Blob(['\ufeff' + text],{ type:'text/markdown;charset=utf-8' })), link = el('a');
  link.href = url; link.download = 'Mio-对话-' + new Date().toLocaleDateString('sv-SE') + '.md'; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1000); toast('Markdown 对话已导出');
};
loadChat();

// 与参考页呼应的细网格和漂浮粒子；隐藏标签页暂停绘制，尊重减少动画设置。
(() => {
  const canvas = $('bg-canvas'), ctx = canvas.getContext('2d'); if (!ctx) return;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)'); let width, height, particles, frame = 0;
  function resize() {
    width = innerWidth; height = innerHeight; const ratio = Math.min(devicePixelRatio || 1,2);
    canvas.width = width*ratio; canvas.height = height*ratio; ctx.setTransform(ratio,0,0,ratio,0,0);
    particles = Array.from({ length:Math.min(52,Math.floor(width*height/21000)) },() => ({ x:Math.random()*width,y:Math.random()*height,vx:(Math.random()-.5)*.13,vy:(Math.random()-.5)*.13,r:Math.random()*1.1+.4 }));
    if (reduced.matches) paint();
  }
  function paint() {
    ctx.clearRect(0,0,width,height); const light = document.documentElement.dataset.theme === 'light';
    particles.forEach(p => { if (!reduced.matches) { p.x = (p.x+p.vx+width)%width; p.y = (p.y+p.vy+height)%height; } ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle = light ? 'rgba(37,99,235,.28)' : 'rgba(100,220,255,.36)'; ctx.fill(); });
    for (let i=0;i<particles.length;i++) for (let j=i+1;j<particles.length;j++) { const a=particles[i],b=particles[j],distance=Math.hypot(a.x-b.x,a.y-b.y); if (distance<120) { ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.strokeStyle = light ? `rgba(37,99,235,${(1-distance/120)*.08})` : `rgba(100,220,255,${(1-distance/120)*.09})`; ctx.lineWidth=.5; ctx.stroke(); } }
  }
  function tick() { paint(); frame = requestAnimationFrame(tick); }
  function restart() { cancelAnimationFrame(frame); frame=0; if (!document.hidden) { if (reduced.matches) paint(); else tick(); } }
  resize(); restart(); addEventListener('resize',resize); document.addEventListener('visibilitychange',restart); document.addEventListener('mio-theme-change',restart); reduced.addEventListener('change',restart);
})();
  </script>
