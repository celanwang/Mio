<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mio · 执行面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0a0a0f; color: #e5e5ea; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; border-bottom: 1px solid #26262e; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 16px; font-weight: 600; }
    header a { color: #8e8e93; text-decoration: none; font-size: 13px; }
    header a:hover { color: #e5e5ea; }
    .live { margin-left: auto; font-size: 12px; color: #30d158; display: flex; align-items: center; gap: 6px; }
    .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #30d158; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    main { flex: 1; display: flex; overflow: hidden; }
    aside { width: 260px; border-right: 1px solid #26262e; overflow-y: auto; flex-shrink: 0; }
    .session { padding: 12px 16px; border-bottom: 1px solid #1c1c22; cursor: pointer; }
    .session:hover { background: #16161d; }
    .session.active { background: #1c1c26; border-left: 3px solid #0a84ff; }
    .session .sid { font-family: monospace; font-size: 12px; color: #8e8e93; }
    .session .preview { font-size: 13px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session .meta { font-size: 11px; color: #636366; margin-top: 4px; }
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tabs { display: flex; gap: 4px; padding: 10px 28px 0; border-bottom: 1px solid #26262e; }
    .tab { padding: 6px 14px; font-size: 13px; color: #8e8e93; cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; }
    .tab.active { color: #e5e5ea; border-bottom-color: #0a84ff; }
    #timeline { flex: 1; overflow-y: auto; padding: 20px 28px; }
    #graph { flex: 1; overflow: auto; padding: 12px; display: none; }
    #graph svg { width: 100%; height: 100%; min-height: 520px; }
    .empty { color: #636366; text-align: center; margin-top: 80px; font-size: 14px; }
    .event { position: relative; padding: 0 0 18px 28px; border-left: 2px solid #26262e; margin-left: 8px; }
    .event::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #636366; }
    .event.user::before { background: #0a84ff; }
    .event.model::before { background: #bf5af2; }
    .event.tool_call::before { background: #ff9f0a; }
    .event.tool_result::before { background: #30d158; }
    .event.jev::before { background: #64d2ff; }
    .event.confirm::before { background: #ffd60a; }
    .event.ask::before { background: #ff453a; }
    .event .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 1px 8px; border-radius: 8px; background: #26262e; color: #a5a5ac; }
    .event.user .badge { background: rgba(10,132,255,.18); color: #64a9ff; }
    .event.model .badge { background: rgba(191,90,242,.18); color: #d29aff; }
    .event.tool_call .badge { background: rgba(255,159,10,.18); color: #ffb84d; }
    .event.tool_result .badge { background: rgba(48,209,88,.18); color: #63e086; }
    .event.jev .badge { background: rgba(100,210,255,.18); color: #8fdcff; }
    .event.confirm .badge { background: rgba(255,214,10,.18); color: #ffe14d; }
    .event.ask .badge { background: rgba(255,69,58,.18); color: #ff8a80; }
    .event .title { font-size: 14px; font-weight: 600; }
    .event .time { font-size: 11px; color: #636366; font-family: monospace; }
    .event details { margin-top: 6px; }
    .event summary { font-size: 12px; color: #8e8e93; cursor: pointer; user-select: none; }
    .event pre { margin-top: 6px; padding: 10px 12px; background: #131318; border: 1px solid #26262e; border-radius: 8px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow-y: auto; }
    .event .detail-inline { margin-top: 6px; font-size: 13px; color: #c8c8ce; white-space: pre-wrap; word-break: break-all; }
    #profile { flex: 1; overflow-y: auto; padding: 20px 28px; display: none; }
    #profile h2 { font-size: 14px; font-weight: 600; margin: 18px 0 10px; color: #e5e5ea; }
    #profile h2:first-child { margin-top: 0; }
    #profile table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #profile th, #profile td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1c1c22; }
    #profile th { color: #8e8e93; font-weight: 500; font-size: 12px; }
    #profile td { color: #c8c8ce; }
    .src { font-size: 11px; padding: 1px 8px; border-radius: 8px; }
    .src.explicit { background: rgba(48,209,88,.18); color: #63e086; }
    .src.inferred { background: rgba(255,159,10,.18); color: #ffb84d; }
    .rowbtn { font-size: 12px; color: #ff8a80; background: none; border: 1px solid #3a2a2a; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
    .rowbtn:hover { background: rgba(255,69,58,.12); }
    .rowbtn.ok { color: #63e086; border-color: #24402a; }
    .rowbtn.ok:hover { background: rgba(48,209,88,.12); }
    .ast { font-size: 11px; padding: 1px 8px; border-radius: 8px; }
    .ast.PROPOSED { background: rgba(255,214,10,.18); color: #ffe14d; }
    .ast.ACTIVE { background: rgba(48,209,88,.18); color: #63e086; }
    .ast.REJECTED { background: #26262e; color: #636366; }
    .rule-rejected td { color: #636366; }
  </style>
</head>
<body>
<header>
  <h1>Mio 执行面板</h1>
  <a href="/">← 返回聊天</a>
  <span class="live">实时刷新</span>
</header>
<main>
  <aside id="sessions"></aside>
  <div class="content">
    <div class="tabs">
      <button class="tab active" data-view="timeline">时间线</button>
      <button class="tab" data-view="graph">链路图</button>
      <button class="tab" data-view="profile">画像</button>
    </div>
    <div id="timeline"><div class="empty">选择左侧会话查看执行链路</div></div>
    <div id="graph"></div>
    <div id="profile"></div>
  </div>
</main>
<script>
let activeSession = null;
let view = 'timeline';
let lastEvents = [];

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    view = tab.dataset.view;
    document.getElementById('timeline').style.display = view === 'timeline' ? 'block' : 'none';
    document.getElementById('graph').style.display = view === 'graph' ? 'block' : 'none';
    document.getElementById('profile').style.display = view === 'profile' ? 'block' : 'none';
    render();
  };
});

async function loadSessions() {
  const res = await fetch('/api/trace/sessions');
  const sessions = await res.json();
  const box = document.getElementById('sessions');
  box.innerHTML = '';
  if (!sessions.length) {
    box.innerHTML = '<div class="empty" style="margin-top:40px">暂无会话</div>';
    return;
  }
  for (const s of sessions) {
    const div = document.createElement('div');
    div.className = 'session' + (s.sessionId === activeSession ? ' active' : '');
    div.innerHTML = `<div class="sid">${s.sessionId.slice(0, 8)}…</div>
      <div class="preview">${escapeHtml(s.firstUserMessage || '（无用户消息）')}</div>
      <div class="meta">${s.eventCount} 个事件 · ${formatTime(s.lastActive)}</div>`;
    div.onclick = () => { activeSession = s.sessionId; loadSessions(); loadEvents(); };
    box.appendChild(div);
  }
  if (!activeSession && sessions.length) {
    activeSession = sessions[0].sessionId;
    loadSessions();
    loadEvents();
  }
}

const TYPE_LABEL = { user: '用户', model: 'Qwen 模型', tool_call: 'Qwen · 工具调用', tool_result: 'MCP 工具返回', jev: 'Jev 模型', confirm: '人工确认', ask: '待确认' };

async function loadEvents() {
  if (!activeSession) return;
  const res = await fetch('/api/trace/' + activeSession);
  lastEvents = await res.json();
  render();
}

function render() {
  if (view === 'timeline') renderTimeline(lastEvents);
  else if (view === 'graph') renderGraph(lastEvents);
  else renderProfile();
}

/* ---------- 画像 ---------- */

const SOURCE_LABEL = { explicit: '手动/明确', inferred: '系统推断' };
const AUTOMATION_STATUS_LABEL = { PROPOSED: '待决定', ACTIVE: '已批准', REJECTED: '已拒绝' };

async function renderProfile() {
  const box = document.getElementById('profile');
  const [entries, rules, automations] = await Promise.all([
    fetch('/api/profile').then(r => r.json()),
    fetch('/api/trust').then(r => r.json()),
    fetch('/api/automations').then(r => r.json())
  ]);
  let html = '<h2>用户画像</h2>';
  if (!entries.length) {
    html += '<div class="empty" style="margin-top:20px">暂无画像条目</div>';
  } else {
    html += '<table><tr><th>作用域</th><th>偏好</th><th>内容</th><th>来源</th><th>置信度</th><th></th></tr>';
    for (const e of entries) {
      html += `<tr><td>${escapeHtml(e.scope)}</td><td>${escapeHtml(e.key)}</td><td>${escapeHtml(e.value)}</td>` +
        `<td><span class="src ${e.source}">${SOURCE_LABEL[e.source] || e.source}</span></td>` +
        `<td>${e.confidence.toFixed(2)}</td>` +
        `<td><button class="rowbtn" onclick="deleteProfile('${encodeURIComponent(e.scope)}','${encodeURIComponent(e.key)}')">删除</button></td></tr>`;
    }
    html += '</table>';
  }
  html += '<h2>自动化规则（批准后才会在会话开始时执行，仍走现有审核流程）</h2>';
  if (!automations.length) {
    html += '<div class="empty" style="margin-top:20px">暂无自动化规则</div>';
  } else {
    html += '<table><tr><th>规则</th><th>工具</th><th>依据</th><th>状态</th><th></th></tr>';
    for (const a of automations) {
      const rejected = a.status === 'REJECTED';
      html += `<tr class="${rejected ? 'rule-rejected' : ''}"><td>${escapeHtml(a.title)}</td><td>${escapeHtml(a.toolName)}</td>` +
        `<td>${escapeHtml(a.reason)}</td><td><span class="ast ${a.status}">${AUTOMATION_STATUS_LABEL[a.status] || a.status}</span></td><td>`;
      if (a.status === 'PROPOSED') {
        html += `<button class="rowbtn ok" onclick="approveAutomation('${a.id}')">批准</button> ` +
          `<button class="rowbtn" onclick="rejectAutomation('${a.id}')">拒绝</button>`;
      } else if (a.status === 'ACTIVE') {
        html += `<button class="rowbtn" onclick="revokeAutomation('${a.id}')">吊销</button>`;
      }
      html += '</td></tr>';
    }
    html += '</table>';
  }
  html += '<h2>信任统计（只统计，不自动放行）</h2>';
  if (!rules.length) {
    html += '<div class="empty" style="margin-top:20px">暂无信任统计</div>';
  } else {
    html += '<table><tr><th>工具</th><th>参数骨架</th><th>批准</th><th>拒绝</th><th></th></tr>';
    for (const r of rules) {
      html += `<tr><td>${escapeHtml(r.toolName)}</td><td>${escapeHtml(r.paramSignature)}</td>` +
        `<td>${r.approvals}</td><td>${r.rejections}</td>` +
        `<td><button class="rowbtn" onclick="resetTrust('${encodeURIComponent(r.toolName)}')">重置</button></td></tr>`;
    }
    html += '</table>';
  }
  box.innerHTML = html;
}

async function deleteProfile(scope, key) {
  await fetch('/api/profile?scope=' + scope + '&key=' + key, { method: 'DELETE' });
  renderProfile();
}

async function resetTrust(tool) {
  await fetch('/api/trust?tool=' + tool, { method: 'DELETE' });
  renderProfile();
}

async function approveAutomation(id) {
  await fetch('/api/automations/' + id + '/approve', { method: 'POST' });
  renderProfile();
}

async function rejectAutomation(id) {
  await fetch('/api/automations/' + id + '/reject', { method: 'POST' });
  renderProfile();
}

async function revokeAutomation(id) {
  await fetch('/api/automations/' + id, { method: 'DELETE' });
  renderProfile();
}

function renderTimeline(events) {
  const box = document.getElementById('timeline');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = '';
  if (!events.length) {
    box.innerHTML = '<div class="empty">该会话暂无事件</div>';
    return;
  }
  for (const e of events) {
    const div = document.createElement('div');
    div.className = 'event ' + e.type;
    const inline = e.detail && e.detail.length <= 120;
    div.innerHTML = `<div class="head"><span class="badge">${TYPE_LABEL[e.type] || e.type}</span>
      <span class="title">${escapeHtml(e.title)}</span>
      <span class="time">${formatTime(e.timestamp)}</span></div>` +
      (e.detail
        ? inline
          ? `<div class="detail-inline">${escapeHtml(e.detail)}</div>`
          : `<details><summary>详情（${e.detail.length} 字符）</summary><pre>${escapeHtml(e.detail)}</pre></details>`
        : '');
    box.appendChild(div);
  }
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

/* ---------- 链路图 ---------- */

const NODE_COLOR = { user: '#0a84ff', qwen: '#bf5af2', tool: '#ff9f0a', jev: '#64d2ff', human: '#ffd60a' };
const NODE_LABEL = { user: '用户', qwen: 'Qwen 模型', jev: 'Jev 模型', human: '人工确认' };

function nodeKind(id) {
  return id.startsWith('tool:') ? 'tool' : id;
}

function buildGraph(events) {
  const nodes = new Map();
  const edges = new Map();
  let prev = null;
  for (const e of events) {
    const id = e.node || 'qwen';
    if (!nodes.has(id)) nodes.set(id, { id, count: 0 });
    nodes.get(id).count++;
    if (prev && prev !== id) {
      // 同一条助手消息内的并行工具调用/返回不是真正的交接，不产生 tool→tool 边。
      const artifact = nodeKind(prev) === 'tool' && nodeKind(id) === 'tool';
      if (!artifact) {
        const key = prev + '->' + id;
        if (!edges.has(key)) edges.set(key, { from: prev, to: id, count: 0 });
        edges.get(key).count++;
      }
    }
    prev = id;
  }
  return { nodes: [...nodes.values()], edges: [...edges.values()] };
}

function layoutNodes(nodes) {
  // 固定泳道布局：用户在左，Qwen 居中，工具在右列，Jev 与人工在底部。
  const pos = {};
  const tools = nodes.filter(n => nodeKind(n.id) === 'tool');
  for (const n of nodes) {
    const kind = nodeKind(n.id);
    if (kind === 'user') pos[n.id] = { x: 100, y: 300 };
    else if (kind === 'qwen') pos[n.id] = { x: 370, y: 300 };
    else if (kind === 'jev') pos[n.id] = { x: 370, y: 500 };
    else if (kind === 'human') pos[n.id] = { x: 640, y: 500 };
  }
  tools.forEach((n, i) => {
    const step = Math.min(90, 460 / Math.max(tools.length, 1));
    pos[n.id] = { x: 660, y: 90 + i * step };
  });
  return pos;
}

function renderGraph(events) {
  const box = document.getElementById('graph');
  box.innerHTML = '';
  if (!events.length) {
    box.innerHTML = '<div class="empty">该会话暂无事件</div>';
    return;
  }
  const { nodes, edges } = buildGraph(events);
  const pos = layoutNodes(nodes);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 800 600');

  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#636366"/></marker>`;
  svg.appendChild(defs);

  const NW = 150, NH = 44;
  for (const e of edges) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) continue;
    const reverse = edges.some(x => x.from === e.to && x.to === e.from);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    // 起止点收缩到节点边缘
    const sx = a.x + (dx / len) * (NW / 2), sy = a.y + (dy / len) * (NH / 2 + 10);
    const tx = b.x - (dx / len) * (NW / 2), ty = b.y - (dy / len) * (NH / 2 + 10);
    const path = document.createElementNS(NS, 'path');
    let d, lx, ly;
    if (reverse) {
      // 双向边错开弯曲
      const mx = (sx + tx) / 2, my = (sy + ty) / 2;
      const nx = -dy / len, ny = dx / len;
      const cx = mx + nx * 40, cy = my + ny * 40;
      d = `M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`;
      lx = cx + nx * 6; ly = cy + ny * 6;
    } else {
      d = `M ${sx} ${sy} L ${tx} ${ty}`;
      lx = (sx + tx) / 2; ly = (sy + ty) / 2 - 6;
    }
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#636366');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('marker-end', 'url(#arrow)');
    svg.appendChild(path);
    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', lx); label.setAttribute('y', ly);
    label.setAttribute('fill', '#8e8e93'); label.setAttribute('font-size', '11');
    label.setAttribute('text-anchor', 'middle');
    label.textContent = '×' + e.count;
    svg.appendChild(label);
  }

  for (const n of nodes) {
    const p = pos[n.id];
    const kind = nodeKind(n.id);
    const color = NODE_COLOR[kind] || '#636366';
    const name = kind === 'tool' ? n.id.slice(5) : (NODE_LABEL[kind] || n.id);
    const g = document.createElementNS(NS, 'g');
    g.innerHTML = `<rect x="${p.x - NW / 2}" y="${p.y - NH / 2}" width="${NW}" height="${NH}" rx="10"
        fill="#131318" stroke="${color}" stroke-width="1.5"/>
      <text x="${p.x}" y="${p.y - 2}" fill="#e5e5ea" font-size="13" font-weight="600" text-anchor="middle">${escapeHtml(name)}</text>
      <text x="${p.x}" y="${p.y + 15}" fill="#8e8e93" font-size="10" text-anchor="middle">${n.count} 次事件</text>`;
    svg.appendChild(g);
  }
  box.appendChild(svg);
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString('zh-CN', { hour12: false });
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

loadSessions();
setInterval(() => {
  loadSessions();
  if (view === 'profile') renderProfile();
  else loadEvents();
}, 2000);
</script>
</body>
</html>
