<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0f">
  <title>Mio · 执行面板</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('mio-theme')==='light'?'light':'dark'}catch(_){}</script>
  <style>
:root {
  font-family: -apple-system, "SF Pro SC", "PingFang SC", system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
  --bg:#0a0a0f; --panel:rgba(22,22,31,.91); --input:#1a1a26; --hover:#20202e;
  --text:#e8eaf0; --secondary:#969ab0; --muted:#757b95;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
  --cyan:#64dcff; --purple:#a78bfa; --pink:#f472b6; --green:#34d399; --amber:#fbbf24;
  --blue:#38bdf8; --yellow:#facc15;
  --nav:rgba(10,10,15,.88); --soft:rgba(167,139,250,.08);
  --shadow-sm:0 1px 2px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.14);
  --shadow-md:0 8px 28px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.16);
  --code:#101018;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --gradient-text:linear-gradient(120deg,var(--cyan),var(--purple));
}
[data-theme=light] {
  color-scheme:light;
  --bg:#f0f2f8; --panel:rgba(255,255,255,.93); --input:#f4f5fa; --hover:#eceef7;
  --text:#1a1a2e; --secondary:#5a5d78; --muted:#6d728c;
  --border:rgba(15,15,40,.09); --border-strong:rgba(15,15,40,.18);
  --cyan:#2563eb; --purple:#7c3aed; --pink:#db2777; --green:#059669; --amber:#b77909;
  --blue:#0284c7; --yellow:#a16207;
  --nav:rgba(240,242,248,.9); --soft:rgba(124,58,237,.045);
  --shadow-sm:0 1px 2px rgba(52,55,100,.06),0 2px 6px rgba(52,55,100,.05);
  --shadow-md:0 6px 22px rgba(52,55,100,.08),0 2px 6px rgba(52,55,100,.05);
  --code:#eef0f7;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;transition:background .35s,color .35s}
button{font:inherit;cursor:pointer;color:inherit}
button,a,summary{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--secondary) 24%,transparent);border-radius:8px}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.symbol-library{position:absolute;width:0;height:0;overflow:hidden}
.mono{font-family:var(--font-mono)}

/* 顶栏：与聊天页同款毛玻璃 */
header{height:64px;padding:0 24px;flex-shrink:0;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);background:var(--nav);backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:30px;height:30px;flex-shrink:0}
.brand h1{font-size:16px;font-weight:600;margin:0;background:var(--gradient-text);background-clip:text;color:transparent;letter-spacing:.5px}
.brand-sub{display:block;margin-top:1px;color:var(--muted);font-size:10px;letter-spacing:1.5px}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--green)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:breathe 1.5s infinite}
@keyframes breathe{50%{opacity:.35}}
.quiet{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;border:1px solid var(--border);background:transparent;border-radius:var(--r-sm);padding:7px 12px;color:var(--secondary);font-size:13px;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.quiet:hover{background:var(--hover);border-color:color-mix(in srgb,var(--purple) 50%,transparent);color:var(--text)}
.icon-button{display:grid;place-items:center;width:34px;height:34px;padding:0}

main{flex:1;display:flex;overflow:hidden;min-height:0}

/* 会话列表：卡片式条目 */
aside{width:264px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:12px}
.session{padding:11px 13px;border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;transition:background .18s,border-color .18s}
.session+.session{margin-top:4px}
.session:hover{background:var(--hover)}
.session.active{background:color-mix(in srgb,var(--cyan) 8%,transparent);border-color:color-mix(in srgb,var(--cyan) 30%,transparent);box-shadow:inset 3px 0 0 var(--cyan)}
.session .sid{font:11px var(--font-mono);color:var(--muted)}
.session .preview{font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.session .meta{font-size:11px;color:var(--muted);margin-top:5px}

.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Tab：Apple 风格分段控件 */
.tabs{display:flex;padding:14px 28px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.tabs-inner{display:inline-flex;gap:2px;padding:3px;background:var(--input);border:1px solid var(--border);border-radius:999px;margin-bottom:-1px;transform:translateY(0)}
.tab{padding:6px 18px;font-size:13px;color:var(--secondary);cursor:pointer;border:0;background:none;border-radius:999px;transition:color .18s,background .18s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);background:var(--panel);box-shadow:var(--shadow-sm)}

#timeline{flex:1;overflow-y:auto;padding:22px 28px}
#graph{flex:1;overflow:auto;padding:16px;display:none}
#graph svg{width:100%;height:100%;min-height:520px}
.empty{color:var(--muted);text-align:center;margin-top:80px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .icon{width:30px;height:30px;color:var(--muted);opacity:.6}

/* 时间线：轨道 + 卡片 */
.event{position:relative;padding:0 0 14px 26px;border-left:2px solid var(--border);margin-left:8px}
.event:last-child{padding-bottom:2px}
.event::before{content:"";position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px var(--bg)}
.event.user::before{background:var(--cyan)}
.event.model::before{background:var(--purple)}
.event.tool_call::before{background:var(--amber)}
.event.tool_result::before{background:var(--green)}
.event.jev::before{background:var(--blue)}
.event.confirm::before{background:var(--yellow)}
.event.ask::before{background:var(--pink)}
.event-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 15px;box-shadow:var(--shadow-sm)}
.event .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--hover);color:var(--secondary)}
.event.user .badge{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan)}
.event.model .badge{background:color-mix(in srgb,var(--purple) 15%,transparent);color:var(--purple)}
.event.tool_call .badge{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.event.tool_result .badge{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.event.jev .badge{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.event.confirm .badge{background:color-mix(in srgb,var(--yellow) 16%,transparent);color:var(--yellow)}
.event.ask .badge{background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--pink)}
.event .title{font-size:14px;font-weight:600}
.event .time{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.event details{margin-top:8px}
.event summary{font-size:12px;color:var(--muted);cursor:pointer;user-select:none;width:fit-content}
.event summary:hover{color:var(--secondary)}
.event pre{margin:8px 0 0;padding:10px 12px;background:var(--code);border:1px solid var(--border);border-radius:var(--r-sm);font:12px/1.6 var(--font-mono);white-space:pre-wrap;word-break:break-all;max-height:320px;overflow-y:auto;color:var(--secondary)}
.event .detail-inline{margin-top:8px;font-size:13px;color:var(--secondary);white-space:pre-wrap;word-break:break-all}

/* 链路图：颜色全部走主题变量 */
.g-edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.75}
.g-arrow{fill:var(--muted)}
.g-label{fill:var(--muted);font-size:11px;font-family:var(--font-mono)}
.g-node{fill:var(--code);stroke-width:1.5}
.g-name{fill:var(--text);font-size:13px;font-weight:600}
.g-count{fill:var(--muted);font-size:10px}
.nk-user{stroke:var(--cyan)}.nk-qwen{stroke:var(--purple)}.nk-tool{stroke:var(--amber)}.nk-jev{stroke:var(--blue)}.nk-human{stroke:var(--yellow)}

/* 画像：分区卡片 + 表格 */
#profile{flex:1;overflow-y:auto;padding:22px 28px;display:none}
#profile h2{font-size:14px;font-weight:600;margin:22px 0 10px;color:var(--text)}
#profile h2:first-child{margin-top:0}
#profile table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm)}
#profile th,#profile td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
#profile tr:last-child td{border-bottom:0}
#profile th{color:var(--muted);font-weight:500;font-size:12px;background:var(--input)}
#profile td{color:var(--secondary)}
.src,.ast{font-size:11px;padding:2px 9px;border-radius:999px}
.src.explicit{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.src.inferred{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.ast.PROPOSED{background:color-mix(in srgb,var(--yellow) 16%,transparent);color:var(--yellow)}
.ast.ACTIVE{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.ast.REJECTED{background:var(--hover);color:var(--muted)}
.rule-rejected td{color:var(--muted)}
.rowbtn{font-size:12px;color:var(--pink);background:none;border:1px solid color-mix(in srgb,var(--pink) 30%,transparent);border-radius:999px;padding:3px 12px;cursor:pointer;transition:background .18s,border-color .18s}
.rowbtn:hover{background:color-mix(in srgb,var(--pink) 10%,transparent);border-color:var(--pink)}
.rowbtn.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.rowbtn.ok:hover{background:color-mix(in srgb,var(--green) 10%,transparent);border-color:var(--green)}

@media(max-width:760px){
  header{padding:0 14px;gap:10px}.brand-sub{display:none}
  main{flex-direction:column}
  aside{width:100%;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--border);padding:10px 14px}
  .session{min-width:190px;max-width:220px;flex-shrink:0;border:1px solid var(--border)}
  .session+.session{margin-top:0}
  .session.active{box-shadow:none}
  .tabs{padding:12px 14px 0}
  #timeline,#profile{padding:16px 14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<svg class="symbol-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
  <linearGradient id="orbit-gradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64dcff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <symbol id="i-orbit" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="url(#orbit-gradient)" stroke-width="1.3" opacity=".6"/><circle cx="24" cy="24" r="12" fill="none" stroke="url(#orbit-gradient)" stroke-width="1.3" opacity=".8"/><circle cx="24" cy="24" r="4" fill="url(#orbit-gradient)"/><circle cx="43" cy="15" r="2.5" fill="#64dcff"/><circle cx="14" cy="31" r="1.7" fill="#a78bfa"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m5 5-5-5 5-5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14a8 8 0 0 1-10-10 8.5 8.5 0 1 0 10 10Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l2.7-8h12.6L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Z"/><path d="M3 13h6l1.5 2.5h3L15 13h6"/></symbol>
</defs></svg>
<header>
  <div class="brand"><svg class="brand-mark" aria-hidden="true"><use href="#i-orbit"/></svg><span><h1>执行面板</h1><small class="brand-sub">Mio · 执行观测</small></span></div>
  <div class="header-actions">
    <span class="live">实时刷新</span>
    <a class="quiet" href="/"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>返回聊天</a>
    <button id="theme" class="quiet icon-button" type="button" aria-label="切换主题" title="切换主题"><svg class="icon" aria-hidden="true"><use id="theme-icon" href="#i-sun"/></svg></button>
  </div>
</header>
<main>
  <aside id="sessions"></aside>
  <div class="content">
    <div class="tabs"><div class="tabs-inner">
      <button class="tab active" data-view="timeline">时间线</button>
      <button class="tab" data-view="graph">链路图</button>
      <button class="tab" data-view="profile">画像</button>
    </div></div>
    <div id="timeline"><div class="empty"><svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>选择左侧会话查看执行链路</div></div>
    <div id="graph"></div>
    <div id="profile"></div>
  </div>
</main>
<script>
let activeSession = null;
let view = 'timeline';
let lastEvents = [];

/* 主题：与聊天页共享 localStorage 键 */
let theme = 'dark';
try { theme = localStorage.getItem('mio-theme') === 'light' ? 'light' : 'dark'; } catch (_) {}
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const label = theme === 'dark' ? '切换浅色主题' : '切换深色主题';
  const btn = document.getElementById('theme');
  btn.setAttribute('aria-label', label); btn.title = label;
  document.getElementById('theme-icon').setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0a0a0f' : '#f0f2f8';
}
applyTheme();
document.getElementById('theme').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  try { localStorage.setItem('mio-theme', theme); } catch (_) {}
};

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    view = tab.dataset.view;
    document.getElementById('timeline').style.display = view === 'timeline' ? 'block' : 'none';
    document.getElementById('graph').style.display = view === 'graph' ? 'block' : 'none';
    document.getElementById('profile').style.display = view === 'profile' ? 'block' : 'none';
    render();
  };
});

async function loadSessions() {
  const res = await fetch('/api/trace/sessions');
  const sessions = await res.json();
  const box = document.getElementById('sessions');
  box.innerHTML = '';
  if (!sessions.length) {
    box.innerHTML = '<div class="empty" style="margin-top:20px">暂无会话</div>';
    return;
  }
  for (const s of sessions) {
    const div = document.createElement('div');
    div.className = 'session' + (s.sessionId === activeSession ? ' active' : '');
    div.innerHTML = `<div class="sid">${s.sessionId.slice(0, 8)}…</div>
      <div class="preview">${escapeHtml(s.firstUserMessage || '（无用户消息）')}</div>
      <div class="meta">${s.eventCount} 个事件 · ${formatTime(s.lastActive)}</div>`;
    div.onclick = () => { activeSession = s.sessionId; loadSessions(); loadEvents(); };
    box.appendChild(div);
  }
  if (!activeSession && sessions.length) {
    activeSession = sessions[0].sessionId;
    loadSessions();
    loadEvents();
  }
}

const TYPE_LABEL = { user: '用户', model: 'Qwen 模型', tool_call: 'Qwen · 工具调用', tool_result: 'MCP 工具返回', jev: 'Jev 模型', confirm: '人工确认', ask: '待确认' };

async function loadEvents() {
  if (!activeSession) return;
  const res = await fetch('/api/trace/' + activeSession);
  lastEvents = await res.json();
  render();
}

function render() {
  if (view === 'timeline') renderTimeline(lastEvents);
  else if (view === 'graph') renderGraph(lastEvents);
  else renderProfile();
}

/* ---------- 画像 ---------- */

const SOURCE_LABEL = { explicit: '手动/明确', inferred: '系统推断' };
const AUTOMATION_STATUS_LABEL = { PROPOSED: '待决定', ACTIVE: '已批准', REJECTED: '已拒绝' };

async function renderProfile() {
  const box = document.getElementById('profile');
  const [entries, rules, automations, entities] = await Promise.all([
    fetch('/api/profile').then(r => r.json()),
    fetch('/api/trust').then(r => r.json()),
    fetch('/api/automations').then(r => r.json()),
    fetch('/api/entities').then(r => r.json())
  ]);
  let html = '<h2>用户画像（Wiki 页）</h2>';
  if (!entries.length) {
    html += '<div class="empty" style="margin-top:20px">暂无画像页面</div>';
  } else {
    html += '<table><tr><th>作用域</th><th>页面</th><th>内容</th><th>来源</th><th>置信度</th><th></th></tr>';
    for (const e of entries) {
      const content = e.content || '';
      const preview = content.length > 60 ? content.slice(0, 60) + '…' : content;
      html += `<tr><td>${escapeHtml(e.scope)}</td><td>${escapeHtml(e.title)}</td>` +
        `<td title="${escapeHtml(content)}">${escapeHtml(preview)}</td>` +
        `<td><span class="src ${e.source}">${SOURCE_LABEL[e.source] || e.source}</span></td>` +
        `<td>${e.confidence.toFixed(2)}</td>` +
        `<td><button class="rowbtn" onclick="deleteProfile('${encodeURIComponent(e.slug)}')">删除</button></td></tr>`;
    }
    html += '</table>';
  }
  html += '<h2>实体簿（对话中提炼的实体关系，供后续意图消歧使用）</h2>';
  if (!entities.length) {
    html += '<div class="empty" style="margin-top:20px">暂无实体关系</div>';
  } else {
    html += '<table><tr><th>主体</th><th>关系</th><th>客体</th></tr>';
    for (const t of entities) {
      html += `<tr><td>${escapeHtml(t.subject)}</td><td>${escapeHtml(t.predicate)}</td><td>${escapeHtml(t.object)}</td></tr>`;
    }
    html += '</table>';
  }
  html += '<h2>自动化规则（批准后才会在会话开始时执行，仍走现有审核流程）</h2>';
  if (!automations.length) {
    html += '<div class="empty" style="margin-top:20px">暂无自动化规则</div>';
  } else {
    html += '<table><tr><th>规则</th><th>工具</th><th>依据</th><th>状态</th><th></th></tr>';
    for (const a of automations) {
      const rejected = a.status === 'REJECTED';
      html += `<tr class="${rejected ? 'rule-rejected' : ''}"><td>${escapeHtml(a.title)}</td><td>${escapeHtml(a.toolName)}</td>` +
        `<td>${escapeHtml(a.reason)}</td><td><span class="ast ${a.status}">${AUTOMATION_STATUS_LABEL[a.status] || a.status}</span></td><td>`;
      if (a.status === 'PROPOSED') {
        html += `<button class="rowbtn ok" onclick="approveAutomation('${a.id}')">批准</button> ` +
          `<button class="rowbtn" onclick="rejectAutomation('${a.id}')">拒绝</button>`;
      } else if (a.status === 'ACTIVE') {
        html += `<button class="rowbtn" onclick="revokeAutomation('${a.id}')">吊销</button>`;
      }
      html += '</td></tr>';
    }
    html += '</table>';
  }
  html += '<h2>信任统计（只统计，不自动放行）</h2>';
  if (!rules.length) {
    html += '<div class="empty" style="margin-top:20px">暂无信任统计</div>';
  } else {
    html += '<table><tr><th>工具</th><th>参数骨架</th><th>批准</th><th>拒绝</th><th></th></tr>';
    for (const r of rules) {
      html += `<tr><td>${escapeHtml(r.toolName)}</td><td>${escapeHtml(r.paramSignature)}</td>` +
        `<td>${r.approvals}</td><td>${r.rejections}</td>` +
        `<td><button class="rowbtn" onclick="resetTrust('${encodeURIComponent(r.toolName)}')">重置</button></td></tr>`;
    }
    html += '</table>';
  }
  box.innerHTML = html;
}

async function deleteProfile(slug) {
  await fetch('/api/profile?slug=' + slug, { method: 'DELETE' });
  renderProfile();
}

async function resetTrust(tool) {
  await fetch('/api/trust?tool=' + tool, { method: 'DELETE' });
  renderProfile();
}

async function approveAutomation(id) {
  await fetch('/api/automations/' + id + '/approve', { method: 'POST' });
  renderProfile();
}

async function rejectAutomation(id) {
  await fetch('/api/automations/' + id + '/reject', { method: 'POST' });
  renderProfile();
}

async function revokeAutomation(id) {
  await fetch('/api/automations/' + id, { method: 'DELETE' });
  renderProfile();
}

function renderTimeline(events) {
  const box = document.getElementById('timeline');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = '';
  if (!events.length) {
    box.innerHTML = '<div class="empty"><svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>该会话暂无事件</div>';
    return;
  }
  for (const e of events) {
    const div = document.createElement('div');
    div.className = 'event ' + e.type;
    const inline = e.detail && e.detail.length <= 120;
    div.innerHTML = `<div class="event-card"><div class="head"><span class="badge">${TYPE_LABEL[e.type] || e.type}</span>
      <span class="title">${escapeHtml(e.title)}</span>
      <span class="time">${formatTime(e.timestamp)}</span></div>` +
      (e.detail
        ? inline
          ? `<div class="detail-inline">${escapeHtml(e.detail)}</div>`
          : `<details><summary>详情（${e.detail.length} 字符）</summary><pre>${escapeHtml(e.detail)}</pre></details>`
        : '') + '</div>';
    box.appendChild(div);
  }
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

/* ---------- 链路图 ---------- */

const NODE_LABEL = { user: '用户', qwen: 'Qwen 模型', jev: 'Jev 模型', human: '人工确认' };

function nodeKind(id) {
  return id.startsWith('tool:') ? 'tool' : id;
}

function buildGraph(events) {
  const nodes = new Map();
  const edges = new Map();
  let prev = null;
  for (const e of events) {
    const id = e.node || 'qwen';
    if (!nodes.has(id)) nodes.set(id, { id, count: 0 });
    nodes.get(id).count++;
    if (prev && prev !== id) {
      // 同一条助手消息内的并行工具调用/返回不是真正的交接，不产生 tool→tool 边。
      const artifact = nodeKind(prev) === 'tool' && nodeKind(id) === 'tool';
      if (!artifact) {
        const key = prev + '->' + id;
        if (!edges.has(key)) edges.set(key, { from: prev, to: id, count: 0 });
        edges.get(key).count++;
      }
    }
    prev = id;
  }
  return { nodes: [...nodes.values()], edges: [...edges.values()] };
}

function layoutNodes(nodes, height) {
  // 固定泳道布局：用户在左，Qwen 居中，工具在右列，Jev 与人工在底部。
  const pos = {};
  const tools = nodes.filter(n => nodeKind(n.id) === 'tool');
  const midY = Math.max(300, Math.round(height * 0.45));
  for (const n of nodes) {
    const kind = nodeKind(n.id);
    if (kind === 'user') pos[n.id] = { x: 100, y: midY };
    else if (kind === 'qwen') pos[n.id] = { x: 370, y: midY };
    else if (kind === 'jev') pos[n.id] = { x: 370, y: height - 100 };
    else if (kind === 'human') pos[n.id] = { x: 640, y: height - 100 };
  }
  tools.forEach((n, i) => {
    const step = Math.min(90, (height - 180) / Math.max(tools.length, 1));
    pos[n.id] = { x: 660, y: 90 + i * step };
  });
  return pos;
}

function renderGraph(events) {
  const box = document.getElementById('graph');
  box.innerHTML = '';
  if (!events.length) {
    box.innerHTML = '<div class="empty"><svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>该会话暂无事件</div>';
    return;
  }
  const { nodes, edges } = buildGraph(events);
  const toolCount = nodes.filter(n => nodeKind(n.id) === 'tool').length;
  const height = Math.max(600, 200 + toolCount * 90);
  const pos = layoutNodes(nodes, height);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 800 ' + height);

  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" class="g-arrow"/></marker>`;
  svg.appendChild(defs);

  const NW = 150, NH = 44;
  for (const e of edges) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) continue;
    const reverse = edges.some(x => x.from === e.to && x.to === e.from);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    // 起止点收缩到节点边缘
    const sx = a.x + (dx / len) * (NW / 2), sy = a.y + (dy / len) * (NH / 2 + 10);
    const tx = b.x - (dx / len) * (NW / 2), ty = b.y - (dy / len) * (NH / 2 + 10);
    const path = document.createElementNS(NS, 'path');
    let d, lx, ly;
    if (reverse) {
      // 双向边错开弯曲
      const mx = (sx + tx) / 2, my = (sy + ty) / 2;
      const nx = -dy / len, ny = dx / len;
      const cx = mx + nx * 40, cy = my + ny * 40;
      d = `M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`;
      lx = cx + nx * 6; ly = cy + ny * 6;
    } else {
      d = `M ${sx} ${sy} L ${tx} ${ty}`;
      lx = (sx + tx) / 2; ly = (sy + ty) / 2 - 6;
    }
    path.setAttribute('d', d);
    path.setAttribute('class', 'g-edge');
    path.setAttribute('marker-end', 'url(#arrow)');
    svg.appendChild(path);
    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', lx); label.setAttribute('y', ly);
    label.setAttribute('class', 'g-label');
    label.setAttribute('text-anchor', 'middle');
    label.textContent = '×' + e.count;
    svg.appendChild(label);
  }

  for (const n of nodes) {
    const p = pos[n.id];
    const kind = nodeKind(n.id);
    const name = kind === 'tool' ? n.id.slice(5) : (NODE_LABEL[kind] || n.id);
    const g = document.createElementNS(NS, 'g');
    g.innerHTML = `<rect x="${p.x - NW / 2}" y="${p.y - NH / 2}" width="${NW}" height="${NH}" rx="10" class="g-node nk-${kind}"/>
      <text x="${p.x}" y="${p.y - 2}" class="g-name" text-anchor="middle">${escapeHtml(name)}</text>
      <text x="${p.x}" y="${p.y + 15}" class="g-count" text-anchor="middle">${n.count} 次事件</text>`;
    svg.appendChild(g);
  }
  box.appendChild(svg);
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString('zh-CN', { hour12: false });
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

loadSessions();
setInterval(() => {
  loadSessions();
  if (view === 'profile') renderProfile();
  else loadEvents();
}, 2000);
