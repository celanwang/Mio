# Mio 记忆层基础设施:PG(长期记忆)+ Redis(短期记忆)
#
# 使用:在本目录放置 .env,填写 PG_PASSWORD / REDIS_PASSWORD(勿提交),
# 然后 docker compose up -d。
#
# 注意:默认仅绑定本机回环；远程部署需显式规划网络访问控制;
# 若应用与本栈同机部署,建议改为 127.0.0.1 绑定并关闭安全组端口。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
      POSTGRES_DB: mio
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /data/redis:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
